name: demandas-mvp

services:
  glpi-db:
    image: mariadb:11.4
    container_name: demandas-glpi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${GLPI_DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${GLPI_DB_NAME}
      MARIADB_USER: ${GLPI_DB_USER}
      MARIADB_PASSWORD: ${GLPI_DB_PASSWORD}
      TZ: ${TZ}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - glpi_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - demandas

  glpi:
    image: glpi/glpi:11.0.7
    container_name: demandas-glpi
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
    environment:
      GLPI_DB_HOST: glpi-db
      GLPI_DB_PORT: 3306
      GLPI_DB_NAME: ${GLPI_DB_NAME}
      GLPI_DB_USER: ${GLPI_DB_USER}
      GLPI_DB_PASSWORD: ${GLPI_DB_PASSWORD}
      GLPI_CRONTAB_ENABLED: 1
      TZ: ${TZ}
    ports:
      - "${GLPI_HTTP_PORT}:80"
    volumes:
      - glpi_data:/var/glpi
      - ./plugins:/var/www/glpi/plugins
      - ./bootstrap:/opt/demandas-bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      demandas:
        ipv4_address: 172.30.250.10

  openproject:
    image: openproject/openproject:17.7.2
    container_name: demandas-openproject
    restart: unless-stopped
    environment:
      OPENPROJECT_HOST__NAME: ${OPENPROJECT_HOST_NAME}
      OPENPROJECT_ADDITIONAL__HOST__NAMES: '["openproject"]'
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_HSTS: "false"
      # Autoriza exclusivamente o endpoint interno do GLPI para entregas de webhook.
      OPENPROJECT_SSRF_PROTECTION_IP_ALLOWLIST: "172.30.250.10/32"
      SECRET_KEY_BASE: "${SECRET_KEY_BASE:?SECRET_KEY_BASE não configurado no .env}"
      OPENPROJECT_DEFAULT__LANGUAGE: pt-BR
      OPENPROJECT_SEED__ADMIN__USER__PASSWORD: ${OPENPROJECT_ADMIN_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${OPENPROJECT_HTTP_PORT}:80"
    volumes:
      - openproject_pgdata:/var/openproject/pgdata
      - openproject_assets:/var/openproject/assets
      - ./bootstrap:/opt/demandas-bootstrap:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost/health_checks/default >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    networks:
      - demandas

networks:
  demandas:
    name: demandas-mvp-network
    ipam:
      config:
        - subnet: 172.30.250.0/24

volumes:
  glpi_db_data:
  glpi_data:
  openproject_pgdata:
  openproject_assets:
